[workspace]
resolver = "3"
members = ["crates/techne-vm", "crates/techne-vm-macros", "crates/techne-text", "crates/techne-editor", "crates/techne-window", "crates/techne-term", "crates/techne-lsp", "crates/techne-process", "crates/techne-net", "crates/techne-node", "crates/techne-host", "crates/techne-sandbox", "crates/techne-cli", "runtime/bench/http/techne"]
# The compositor, parked until Stage 4, is a workspace of its own: its
# dependencies (smithay, pipewire, ...) and its license (GPL) stay apart.
exclude = ["crates/techne-compositor", "crates/techne-hermit"]

[workspace.package]
license = "MIT OR Apache-2.0"

[profile.release]
debug = 1
# Panics unwind: a frontend outlives its runtime thread's crash and starts
# another (`techne_editor::host`).
