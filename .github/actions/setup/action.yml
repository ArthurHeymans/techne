name: Set up
description: >-
  Nix, and the Rust cache keyed by the dev shell's own toolchain. Run after
  checkout; later steps run in the dev shell themselves.
inputs:
  shell:
    description: The flake dev shell the job's commands run in.
    default: default
  workspaces:
    description: The Cargo workspaces whose dependencies are cached.
    default: ". -> target"
runs:
  using: composite
  steps:
    - uses: cachix/install-nix-action@v31
    # Cache the dev shell's Nix store paths across runs so jobs do not
    # re-download the toolchain and tools from cache.nixos.org every time.
    - uses: nix-community/cache-nix-action@v7
      with:
        primary-key: nix-${{ runner.os }}-${{ runner.arch }}-${{ inputs.shell }}-${{ hashFiles('flake.nix', 'flake.lock', 'rust-toolchain.toml') }}
        restore-prefixes-first-match: nix-${{ runner.os }}-${{ runner.arch }}-${{ inputs.shell }}-
    # The cache action calls cargo and rustc itself, and keys the cache by the
    # rustc version: give it the dev shell's, not the runner's.
    - name: Put the dev shell's toolchain on PATH
      shell: bash
      run: |
        nix develop ".#$SHELL_NAME" --command bash -c '
          dirname "$(command -v cargo)"
          dirname "$(command -v rustc)"' >> "$GITHUB_PATH"
      env:
        SHELL_NAME: ${{ inputs.shell }}
    # Dependencies only, per job (and so per architecture and dev shell);
    # the workspace's own crates are rebuilt.
    - uses: Swatinem/rust-cache@v2
      with:
        workspaces: ${{ inputs.workspaces }}
        key: >-
          ${{ inputs.shell }}-${{ hashFiles('flake.lock',
            'rust-toolchain.toml') }}
