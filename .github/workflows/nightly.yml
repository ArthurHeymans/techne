name: Nightly

# Longer runs than every push can afford.
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_RELEASE_DEBUG: "0"

defaults:
  run:
    shell: nix develop --command bash -e {0}

jobs:
  # The JIT-against-interpreter fuzzer over many more programs, starting
  # from a different seed every night.
  fuzz:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      # Reproduce a failure with TECHNE_FUZZ_START=<seed> TECHNE_FUZZ_SEEDS=1.
      - run: |
          export TECHNE_FUZZ_START=$(( $(date +%s) / 86400 * 5000 ))
          export TECHNE_FUZZ_SEEDS=5000
          echo "seeds from $TECHNE_FUZZ_START" >> "$GITHUB_STEP_SUMMARY"
          cargo test --release -p techne-vm --features counting-allocator --test fuzz
      # The host API across worlds, many more runs: reproduce a failure with
      # TECHNE_HOST_API_START=<seed> TECHNE_HOST_API_SEEDS=1.
      - run: |
          export TECHNE_HOST_API_START=$(( $(date +%s) / 86400 * 2000 ))
          export TECHNE_HOST_API_SEEDS=2000
          echo "host API seeds from $TECHNE_HOST_API_START" >> "$GITHUB_STEP_SUMMARY"
          cargo test --release -p techne-vm --features counting-allocator --test host_api

  # The VM's unsafe code under Miri (runtime/TECHNE-VM.md), using the same
  # pinned nightly toolchain as the dev shell and the other jobs.
  miri:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      # Check allocator metadata and values under default Stacked Borrows.
      - run: |
          cargo miri test -p techne-vm --features counting-allocator --test counting
          cargo miri test -p techne-vm --lib value::tests
        env:
          MIRIFLAGS: ""
          TECHNE_JIT: "0"
      - run: cargo miri test -p techne-vm --test miri
        env:
          MIRIFLAGS: -Zmiri-permissive-provenance -Zmiri-tree-borrows
      - run: cargo miri test -p techne-vm --lib vm::tests
        env:
          MIRIFLAGS: -Zmiri-permissive-provenance -Zmiri-tree-borrows
      - run: cargo miri test -p techne-vm --lib api::tests
        env:
          MIRIFLAGS: -Zmiri-permissive-provenance -Zmiri-tree-borrows

  # Line coverage of the default crates by all their tests.
  coverage:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: |
          cargo llvm-cov --release --html
          cargo llvm-cov report --release --summary-only > summary.txt
          { echo '```'; cat summary.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
        env:
          TECHNE_TEST_MODES: default
          # Instrumented, the slowest benchmarks (cpstak) take more than
          # the suites' 120 s.
          TECHNE_SUITE_TIMEOUT: "600"
      - uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: target/llvm-cov/html

  # The HTTP benchmark (runtime/bench/http), techne's server only, a few
  # seconds per run: wall time on a shared runner, shown, not compared.
  # Two cores serve, two run wrk.
  http:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: |
          nix shell --inputs-from . nixpkgs#wrk --command env EXPERIMENTS="smp work idle" IMPLS='^techne$' \
            CPUS=0-1 LOADCPUS=2-3 WRK_THREADS=2 DURATION=3 WARMUP=1 OUT=results/ci runtime/bench/http/run.sh
          { echo 'HTTP server (wall time, noisy on CI; 2 cores):'; echo
            python3 runtime/bench/http/summarize.py runtime/bench/http/results/ci/results.tsv; } >> "$GITHUB_STEP_SUMMARY"

  # A night that fails opens an issue, or comments on the one still open,
  # so that it does not wait for someone to look at the runs. The failing
  # seed is in the run's log.
  report:
    needs: [fuzz, miri, coverage, http]
    if: failure()
    runs-on: ubuntu-24.04
    permissions:
      issues: write
    defaults:
      run:
        shell: bash
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          NEEDS: ${{ toJSON(needs) }}
        run: |
          failed=$(jq -r 'to_entries[] | select(.value.result == "failure") | .key' <<<"$NEEDS" | paste -sd ' ' -)
          body="Nightly run failed ($failed): $RUN"
          gh label create nightly --color B60205 --description "A nightly run failed" 2>/dev/null || true
          open=$(gh issue list --label nightly --state open --json number --jq '.[0].number // empty')
          if [[ -n $open ]]; then
            gh issue comment "$open" --body "$body"
          else
            gh issue create --title "Nightly runs fail" --label nightly --body "$body"
          fi
