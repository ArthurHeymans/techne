name: CI

on:
  push:
    branches: [main]
  pull_request:
    # A label can accept a benchmark regression (bench).
    types: [opened, synchronize, reopened, labeled, unlabeled]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # Debug info is for profiling locally; here it only slows compiling and
  # linking.
  CARGO_PROFILE_RELEASE_DEBUG: "0"
  # Fast linking across test binaries (mold is in the flake dev shells).
  CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
  CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_RUSTFLAGS: "-C link-arg=-fuse-ld=mold"

# Every command runs in the flake's dev shell, as it does locally.
defaults:
  run:
    shell: nix develop --command bash -e {0}

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --release -- -D warnings
      # Raw access outside the VM core must only decrease: in a pull
      # request, no ceiling above the base branch's.
      - run: |
          budget=crates/techne-vm/tests/unsafe-budget.txt
          if [ -n "$BASE" ]; then
            git fetch --depth=1 origin "$BASE"
            # A base before the budget existed has nothing to compare with.
            if git cat-file -e "FETCH_HEAD:$budget"; then
              git show "FETCH_HEAD:$budget" > /tmp/unsafe-base.txt
              export TECHNE_UNSAFE_BASE=/tmp/unsafe-base.txt
            fi
          fi
          cargo test --release -p techne-vm --test unsafe_ratchet
        env:
          BASE: ${{ github.base_ref }}
      # The Rust API's documentation: no broken links or markup.
      - run: cargo doc --no-deps --release
        env:
          RUSTDOCFLAGS: -D warnings
      # The dependency graph: advisories, licenses, sources (deny.toml).
      - run: cargo deny check -D yanked
      - run: typos
      # The Emacs client compiles without warnings.
      - run: emacs -Q --batch -L editors/emacs --eval '(setq byte-compile-error-on-warn t)' -f batch-byte-compile editors/emacs/techne.el

  # Rust tests of all default crates, and the Scheme suites in their default
  # mode. nextest runs tests from all test binaries in parallel; it does not
  # run doctests, which cargo test does.
  test:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      # Ubuntu's AppArmor keeps unprivileged user namespaces from what it
      # does not know: lifted, so that the sandbox's tests run, not skip.
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
        shell: bash
      - run: cargo nextest run --release --no-fail-fast
        env:
          TECHNE_TEST_MODES: default
      # All workspace Scheme suites (packages + core + editor), plus GC stress on vm suites.
      - run: target/release/techne test --all
      - run: target/release/techne test --all --environment vm --timeout 300
        env:
          TECHNE_GC_STRESS: "1"
      # Package manifests, library docstrings, and editor documentation checks.
      - run: target/release/techne check --all
      # The Emacs client against the server the tests above built.
      - run: TECHNE_NODE=$PWD/target/release/techne-node emacs -Q --batch -L editors/emacs -l editors/emacs/techne-test.el -f ert-run-tests-batch-and-exit
      - run: cargo test --release --doc
      # Worlds as a boundary between tenants: a world given what a VM bug
      # would give it reaches nothing of another's.
      - run: cargo test --release -p techne-vm --features hostile,counting-allocator --test hostile

  # Exercise the real render/readback path on a CPU Vulkan driver, without
  # a desktop or physical GPU. The independent compositor capture must agree.
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: nix develop .#window --command bash -e {0}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          shell: window
      - run: |
          export VK_DRIVER_FILES="$TECHNE_SOFTWARE_VULKAN_DRIVER"
          export WGPU_BACKEND=vulkan WLR_RENDERER=pixman
          export TECHNE_CAPTURE_ARTIFACTS="$RUNNER_TEMP/techne-capture"
          cargo test --release -p techne-cli --test capture -- \
            --ignored --nocapture
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: capture-failure
          path: ${{ runner.temp }}/techne-capture

  # The Scheme suites (own, R7RS, r7rs-benchmarks) in the other modes, which
  # must give the same results as the default one.
  suites:
    strategy:
      fail-fast: false
      matrix:
        mode: [interp, jit, gc, no-ir-interp, no-ir-jit]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: cargo test --release --no-fail-fast -p techne-vm --features counting-allocator --test suites
        env:
          TECHNE_TEST_MODES: ${{ matrix.mode }}
      # The gc mode's VM suite already runs in `test` on both x86_64 and arm64.
      # The VM test runner needs no GUI frontend.
      - if: matrix.mode != 'gc'
        run: cargo build --release -p techne-cli --no-default-features
      - if: matrix.mode != 'gc'
        run: |
          timeout=120
          case "$MODE" in
            interp) export TECHNE_JIT=0 ;;
            jit) export TECHNE_JIT=1 ;;
            no-ir-interp) export TECHNE_IR=0 TECHNE_JIT=0 ;;
            no-ir-jit) export TECHNE_IR=0 TECHNE_JIT=1 ;;
          esac
          target/release/techne test --all --environment vm --timeout "$timeout"
        env:
          MODE: ${{ matrix.mode }}

  # The flake's package: the binary finds its Lisp where it is installed.
  package:
    runs-on: ubuntu-24.04
    # It runs the binary it built: no write access, no credentials kept.
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@v31
      - uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ runner.arch }}-package-${{ hashFiles('flake.nix', 'flake.lock', 'Cargo.lock', 'rust-toolchain.toml') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-${{ runner.arch }}-package-
      - run: nix build -L .#techne
      - run: |
          echo '(import (scheme base) (scheme write) (srfi 1)) (write (iota 3))' > /tmp/t.scm
          test "$(result/bin/techne run /tmp/t.scm)" = "(0 1 2)"
      - run: |
          mkdir -p /tmp/smoke-pkg/tests
          echo '(package smoke-pkg)' > /tmp/smoke-pkg/techne-package.scm
          echo '(import (techne test)) (define-test "adds" (assert-equal 4 (+ 2 2)))' > /tmp/smoke-pkg/tests/smoke-test.scm
          result/bin/techne test /tmp/smoke-pkg

  # Random keys for the editor (crates/techne-editor/examples/keyfuzz.rs),
  # from fixed seeds: an error no command raised, a violation in the
  # editor's code, a crash or a hang fails, and so does a key over the
  # keystroke budget of instructions, with a short key sequence
  # reproducing it.
  keyfuzz:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: cargo build --release -p techne-editor --example keyfuzz
      - run: target/release/examples/keyfuzz fuzz --seeds 0-7 --keys 300
      - run: target/release/examples/keyfuzz count --seeds 0-2 --keys 150 --shrink

  # Instruction counts and GC pause work (runtime/bench/icount.scm): exact
  # enough to compare across runs on shared runners. History is kept on the
  # gh-pages branch. Each pull request gets a comment comparing its numbers
  # with main's; one that regresses a number by more than 5% fails unless
  # labeled accepted-regression: a cost its description justifies. On main
  # such a regression was decided on in its pull request: it only gets a
  # comment on the commit.
  bench:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      # The techne command, which runs icount.scm, needs no frontend.
      # Build all benchmark targets in one Cargo invocation so techne-vm is
      # compiled once and Cargo schedules the crates together.
      - run: cargo build --release --no-default-features -p techne-vm --features techne-vm/counting-allocator --bin techne-vm --example serve --example compile -p techne-editor --example startup --example keys --example restart -p techne-cli --bin techne
      - run: |
          status=0
          TECHNE_EDITOR_STARTUP=$PWD/target/release/examples/startup TECHNE_EDITOR_KEYS=$PWD/target/release/examples/keys \
            TECHNE_SERVE=$PWD/target/release/examples/serve TECHNE_COMPILE=$PWD/target/release/examples/compile \
            target/release/techne run runtime/bench/icount.scm icount.json footprint.json 2> table.txt || status=$?
          cat table.txt
          { echo '```'; cat table.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
      # Wall time on a shared runner: shown, not compared.
      - run: |
          target/release/examples/keys > keys.txt
          { echo 'Keystroke latency (wall time, noisy on CI):'; echo '```'; cat keys.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          target/release/examples/restart > restart.txt
          { echo 'Startup and restart (wall time, noisy on CI):'; echo '```'; cat restart.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: benchmark-action/github-action-benchmark@v1
        with:
          name: techne-vm
          tool: customSmallerIsBetter
          output-file-path: icount.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: ${{ github.event_name == 'push' }}
          save-data-file: ${{ github.event_name == 'push' }}
          alert-threshold: '105%'
          fail-on-alert: ${{ github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'accepted-regression') }}
          comment-on-alert: true
          comment-always: ${{ github.event_name == 'pull_request' }}
          summary-always: true
      # What the editor loads grows with what it ships: charted, held to
      # the startup budget by icount.scm, never compared.
      - uses: benchmark-action/github-action-benchmark@v1
        with:
          name: techne-editor footprint
          tool: customSmallerIsBetter
          output-file-path: footprint.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          # The step before fetched gh-pages, and committed to it on main.
          skip-fetch-gh-pages: true
          auto-push: ${{ github.event_name == 'push' }}
          save-data-file: ${{ github.event_name == 'push' }}
          fail-on-alert: false
          comment-on-alert: false
          summary-always: true
