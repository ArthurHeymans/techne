name: CI

on:
  push:
    branches: [main]
  pull_request:
    # A label can accept a benchmark regression (bench).
    types: [opened, synchronize, reopened, labeled, unlabeled]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # Debug info is for profiling locally; here it only slows compiling and
  # linking.
  CARGO_PROFILE_RELEASE_DEBUG: "0"

# Every command runs in the flake's dev shell, as it does locally.
defaults:
  run:
    shell: nix develop --command bash -e {0}

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --release -- -D warnings
      # Raw access outside the VM core must only decrease: in a pull
      # request, no ceiling above the base branch's.
      - run: |
          budget=crates/techne-vm/tests/unsafe-budget.txt
          if [ -n "$BASE" ]; then
            git fetch --depth=1 origin "$BASE"
            # A base before the budget existed has nothing to compare with.
            if git cat-file -e "FETCH_HEAD:$budget"; then
              git show "FETCH_HEAD:$budget" > /tmp/unsafe-base.txt
              export TECHNE_UNSAFE_BASE=/tmp/unsafe-base.txt
            fi
          fi
          cargo test --release -p techne-vm --test unsafe_ratchet
        env:
          BASE: ${{ github.base_ref }}
      # The Rust API's documentation: no broken links or markup.
      - run: cargo doc --no-deps --release
        env:
          RUSTDOCFLAGS: -D warnings
      - run: typos
      # The Emacs client compiles without warnings.
      - run: emacs -Q --batch -L editors/emacs --eval '(setq byte-compile-error-on-warn t)' -f batch-byte-compile editors/emacs/techne.el

  # Rust tests of all default crates, and the Scheme suites in their default
  # mode. nextest runs tests from all test binaries in parallel; it does not
  # run doctests, which cargo test does.
  test:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      # Ubuntu's AppArmor keeps unprivileged user namespaces from what it
      # does not know: lifted, so that the sandbox's tests run, not skip.
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
        shell: bash
      - run: cargo nextest run --release --no-fail-fast
        env:
          TECHNE_TEST_MODES: default
      # The Emacs client against the server the tests above built.
      - run: TECHNE_NODE=$PWD/target/release/techne-node emacs -Q --batch -L editors/emacs -l editors/emacs/techne-test.el -f ert-run-tests-batch-and-exit
      - run: cargo test --release --doc
      # Worlds as a boundary between tenants: a world given what a VM bug
      # would give it reaches nothing of another's.
      - run: cargo test --release -p techne-vm --features hostile,counting-allocator --test hostile

  # The Scheme suites (own, R7RS, r7rs-benchmarks) in the other modes, which
  # must give the same results as the default one.
  suites:
    strategy:
      fail-fast: false
      matrix:
        mode: [interp, jit, gc, no-ir-interp, no-ir-jit]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: cargo test --release --no-fail-fast -p techne-vm --features counting-allocator --test suites
        env:
          TECHNE_TEST_MODES: ${{ matrix.mode }}

  # The flake's package: the binary finds its Lisp where it is installed.
  package:
    runs-on: ubuntu-24.04
    # It runs the binary it built: no write access, no credentials kept.
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@v31
      - run: nix build -L .#techne
      - run: |
          echo '(import (scheme base) (scheme write) (srfi 1)) (write (iota 3))' > /tmp/t.scm
          test "$(result/bin/techne run /tmp/t.scm)" = "(0 1 2)"

  compositor:
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: nix develop .#compositor --command bash -e {0}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          shell: compositor
          workspaces: crates/techne-compositor -> target
      # A workspace of its own (see the root Cargo.toml).
      - run: cargo fmt --check
        working-directory: crates/techne-compositor
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: crates/techne-compositor
      # Some tests set process-wide environment variables.
      - run: cargo test -- --test-threads=1
        working-directory: crates/techne-compositor

  # Random keys for the editor (crates/techne-editor/examples/keyfuzz.rs),
  # from fixed seeds: an error no command raised, a violation in the
  # editor's code, a crash or a hang fails, and so does a key over the
  # keystroke budget of instructions, with a short key sequence
  # reproducing it.
  keyfuzz:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: cargo build --release -p techne-editor --example keyfuzz
      - run: target/release/examples/keyfuzz fuzz --seeds 0-7 --keys 300
      - run: target/release/examples/keyfuzz count --seeds 0-2 --keys 150 --shrink

  # Instruction counts and GC pause work (runtime/bench/icount.sh): exact
  # enough to compare across runs on shared runners. History is kept on the
  # gh-pages branch. Each pull request gets a comment comparing its numbers
  # with main's; one that regresses a number by more than 5% fails unless
  # labeled accepted-regression: a cost its description justifies. On main
  # such a regression was decided on in its pull request: it only gets a
  # comment on the commit.
  bench:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: cargo build --release -p techne-vm --features counting-allocator --bin techne-vm --example serve --example compile && cargo build --release -p techne-editor --example startup --example keys --example restart
      - run: |
          TECHNE_EDITOR_STARTUP=$PWD/target/release/examples/startup TECHNE_EDITOR_KEYS=$PWD/target/release/examples/keys \
            TECHNE_SERVE=$PWD/target/release/examples/serve TECHNE_COMPILE=$PWD/target/release/examples/compile runtime/bench/icount.sh icount.json 2> table.txt
          { echo '```'; cat table.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      # Wall time on a shared runner: shown, not compared.
      - run: |
          target/release/examples/keys > keys.txt
          { echo 'Keystroke latency (wall time, noisy on CI):'; echo '```'; cat keys.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          target/release/examples/restart > restart.txt
          { echo 'Startup and restart (wall time, noisy on CI):'; echo '```'; cat restart.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: benchmark-action/github-action-benchmark@v1
        with:
          name: techne-vm
          tool: customSmallerIsBetter
          output-file-path: icount.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: ${{ github.event_name == 'push' }}
          save-data-file: ${{ github.event_name == 'push' }}
          alert-threshold: '105%'
          fail-on-alert: ${{ github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'accepted-regression') }}
          comment-on-alert: true
          comment-always: ${{ github.event_name == 'pull_request' }}
          summary-always: true
