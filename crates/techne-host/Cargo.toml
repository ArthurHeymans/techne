[package]
name = "techne-host"
version = "0.1.0"
edition = "2024"
license.workspace = true
publish = false
description = "Serving deployments of techne Lisp from worlds: instances from snapshots, under lifetimes"

[dependencies]
techne-vm = { path = "../techne-vm" }
techne-sandbox = { path = "../techne-sandbox" }
libc = "0.2"
tokio = { version = "1", features = ["rt", "sync", "time", "net", "io-util", "process"] }
# Fetching for deployments (`egress`): TLS by rustls on ring, Mozilla's
# roots, no proxies, no system resolver of its own.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"
url = "2"

[dev-dependencies]
techne-vm = { path = "../techne-vm", features = ["counting-allocator"] }
techne-net = { path = "../techne-net" }
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }
tempfile = "3"

# A worker for the tests (`techne cloud worker` is the real one), which
# gives deployments' worlds a native that never returns, with
# TECHNE_TEST_SPIN set.
[[bin]]
name = "techne-worker"
path = "src/bin/worker.rs"
test = false
