[package]
name = "techne-store"
version = "0.1.0"
edition = "2024"
license.workspace = true
publish = false
description = "Bounded asynchronous SQLite mechanism for Techne Scheme"

[dependencies]
techne-vm = { path = "../techne-vm" }
rusqlite = { version = "0.41", features = ["bundled", "hooks", "limits"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync"] }

rustix = { version = "1", features = ["process"] }

[dev-dependencies]
tempfile = "3"
