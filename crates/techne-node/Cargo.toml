[package]
name = "techne-node"
version = "0.1.0"
edition = "2024"
license.workspace = true
publish = false
description = "A techne node: Lisp evaluation, inspection and processes on another machine, over stdio"

[features]
# The binary's: charge Rust allocations to the world making them
# (techne-vm's `counting-allocator`), as the `techne` binary does. The
# library leaves that to the application.
counting-allocator = ["techne-vm/counting-allocator"]

[dev-dependencies]
# Tests and examples charge Rust allocations to worlds, as the `techne`
# binary does.
techne-vm = { path = "../techne-vm", features = ["counting-allocator"] }
rustix = { version = "1", features = ["process"] }

[dependencies]
techne-vm = { path = "../techne-vm" }
techne-process = { path = "../techne-process" }
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
rmp-serde = "1.3"
tokio = { version = "1", features = ["rt-multi-thread", "process", "io-util", "io-std", "sync", "signal", "macros", "time", "net"] }
rustix = { version = "1", features = ["stdio", "fs", "process"] }

[[bin]]
name = "techne-node"
path = "src/main.rs"
required-features = ["counting-allocator"]

# They run the binary.
[[test]]
name = "node"
required-features = ["counting-allocator"]

[[test]]
name = "nrepl"
required-features = ["counting-allocator"]
