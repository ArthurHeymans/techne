[package]
name = "techne-node"
version = "0.1.0"
edition = "2024"
license.workspace = true
publish = false
description = "A techne node: Lisp evaluation, inspection and processes on another machine, over stdio"

[dev-dependencies]
rustix = { version = "1", features = ["process"] }

[dependencies]
techne-vm = { path = "../techne-vm" }
techne-process = { path = "../techne-process" }
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
rmp-serde = "1.3"
tokio = { version = "1", features = ["rt-multi-thread", "process", "io-util", "io-std", "sync", "signal", "macros", "time", "net"] }
rustix = { version = "1", features = ["stdio", "fs", "process"] }
