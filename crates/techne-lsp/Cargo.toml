[package]
name = "techne-lsp"
version = "0.1.0"
edition = "2024"
license.workspace = true
publish = false

[features]
# The binary's: charge Rust allocations to the world making them
# (techne-vm's `counting-allocator`), as the `techne` binary does. The
# library leaves that to the application.
counting-allocator = ["techne-vm/counting-allocator"]

[dependencies]
techne-vm = { path = "../techne-vm" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower-lsp = "0.20"
tokio = { version = "1", features = ["rt", "macros", "io-std"] }

[dev-dependencies]
# Tests and examples charge Rust allocations to worlds, as the `techne`
# binary does.
techne-vm = { path = "../techne-vm", features = ["counting-allocator"] }

[[bin]]
name = "techne-lsp"
path = "src/main.rs"
required-features = ["counting-allocator"]

# It runs the binary.
[[test]]
name = "server"
required-features = ["counting-allocator"]
