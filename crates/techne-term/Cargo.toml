[package]
name = "techne-term"
version = "0.1.0"
edition = "2024"
license.workspace = true
publish = false
description = "The editor in a terminal: cells, grapheme widths and key limits, over the presentation protocol"

[[bin]]
name = "techne-term"
path = "src/main.rs"

[dependencies]
techne-editor = { path = "../techne-editor" }
techne-text = { path = "../techne-text" }
unicode-segmentation = "1"
unicode-width = "0.2"
# Raw mode and the terminal's size; input is decoded by our own normalizer.
crossterm = { version = "0.29", default-features = false }
signal-hook = "0.4"

[dev-dependencies]
tempfile = "3"
