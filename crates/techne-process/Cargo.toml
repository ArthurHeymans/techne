[package]
name = "techne-process"
version = "0.1.0"
edition = "2024"
publish = false
description = "Child processes (pipes or a pty) for techne Lisp: the Stage 0B process probe"

[dependencies]
techne-vm = { path = "../techne-vm" }
tokio = { version = "1", features = ["rt-multi-thread", "process", "io-util", "sync", "time"] }
pty-process = { version = "0.5", features = ["async"] }
rustix = { version = "1", features = ["process"] }
serde = { version = "1", features = ["derive"] }
