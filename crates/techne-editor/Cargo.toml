[package]
name = "techne-editor"
version = "0.1.0"
edition = "2024"
license.workspace = true
publish = false
description = "The editor's documents and views for techne Lisp; its commands and key profiles are Lisp (lisp/editor)"

[dependencies]
techne-vm = { path = "../techne-vm" }
techne-text = { path = "../techne-text" }
techne-process = { path = "../techne-process" }
techne-net = { path = "../techne-net" }
techne-node = { path = "../techne-node" }
memchr = "2.8"
regex-cursor = "0.1.5"
serde = { version = "1", features = ["derive"] }
rmp-serde = "1.3"
tokio = { version = "1", features = ["sync"] }
ignore = "0.4.33"
rustix = { version = "1", features = ["fs"] }
techne-syntax = { path = "../techne-syntax" }
tree-sitter = "0.27"
tree-sitter-md = "0.5.4"
# Images decoded for frontends to draw (images.rs): the raster formats
# documents and screenshots use, and SVG.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
resvg = { version = "0.49", default-features = false, features = ["text", "system-fonts", "raster-images"] }

[dev-dependencies]
tree-sitter-rust = "0.24.2"
# Tests and examples charge Rust allocations to worlds, as the `techne`
# binary does.
techne-vm = { path = "../techne-vm", features = ["counting-allocator"] }
tempfile = "3"
wait-timeout = "0.2"
serde_json = "1"

[[example]]
name = "keyfuzz"
test = true
