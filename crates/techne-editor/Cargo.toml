[package]
name = "techne-editor"
version = "0.1.0"
edition = "2024"
license.workspace = true
publish = false
description = "The editor's documents and views for techne Lisp; its commands and key profiles are Lisp (lisp/editor)"

[dependencies]
techne-vm = { path = "../techne-vm" }
techne-text = { path = "../techne-text" }
techne-process = { path = "../techne-process" }
techne-net = { path = "../techne-net" }
techne-node = { path = "../techne-node" }
memchr = "2.8"
regex-cursor = "0.1.5"
serde = { version = "1", features = ["derive"] }
rmp-serde = "1.3"
tokio = { version = "1", features = ["sync"] }
ignore = "0.4.33"
rustix = { version = "1", features = ["fs"] }
tree-sitter = "0.27"
tree-sitter-rust = "0.24.2"
tree-sitter-python = "0.25.0"
tree-sitter-c = "0.24.2"
tree-sitter-javascript = "0.25.0"
tree-sitter-typescript = "0.23.2"
tree-sitter-go = "0.25.0"
tree-sitter-json = "0.24.8"
tree-sitter-yaml = "0.7.2"
tree-sitter-toml-ng = "0.7.0"
tree-sitter-md = "0.5.4"
tree-sitter-scheme = "0.25.0"
tree-sitter-bash = "0.25.1"
tree-sitter-language = "0.1.9"

[dev-dependencies]
# Tests and examples charge Rust allocations to worlds, as the `techne`
# binary does.
techne-vm = { path = "../techne-vm", features = ["counting-allocator"] }
tempfile = "3"
wait-timeout = "0.2"
serde_json = "1"

[[example]]
name = "keyfuzz"
test = true
