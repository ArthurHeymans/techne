[package]
name = "techne-terminal"
version = "0.1.0"
edition = "2024"
license.workspace = true
publish = false
description = "The editor in a terminal: the cell frontend"

[[bin]]
name = "techne-term"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

[dependencies]
techne-editor = { path = "../techne-editor" }
techne-text = { path = "../techne-text" }
ratatui = "0.30"
unicode-segmentation = "1"
unicode-width = "0.2"
