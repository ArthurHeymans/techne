[package]
name = "techne-vm"
version = "0.1.0"
edition = "2024"
license.workspace = true
publish = false

[dependencies]
techne-vm-macros = { path = "../techne-vm-macros" }
rustc-hash = "2"
stacker = "0.1"
caseless = "0.2"
num-bigint = "0.4"
num-complex = { version = "0.4", default-features = false, features = ["std"] }
num-integer = "0.1"
num-rational = { version = "0.4", default-features = false, features = ["num-bigint", "std"] }
num-traits = "0.2"
ctrlc = "3.5"
cranelift-codegen = "0.134"
cranelift-frontend = "0.134"
cranelift-jit = "0.134"
cranelift-module = "0.134"
cranelift-native = "0.134"
rustyline = { version = "15", default-features = false, features = ["with-file-history"] }
regex-cursor = { version = "0.1.5", default-features = false, features = ["perf-inline"] }
regex-syntax = { version = "0.8", default-features = false, features = ["std", "unicode"] }

[dev-dependencies]
libtest-mimic = "0.8"
wait-timeout = "0.2"
tempfile = "3"

# Scheme suites: our own, R7RS conformance and the r7rs-benchmarks programs.
[[test]]
name = "suites"
harness = false

# The heap is raw pointers by design: its accessors are public for the crates
# embedding the VM and document their contract in heap.rs, not per function.
[lints.clippy]
missing_safety_doc = "allow"
not_unsafe_ptr_arg_deref = "allow"
too_many_arguments = "allow"
