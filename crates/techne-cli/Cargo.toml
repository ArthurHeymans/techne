[package]
name = "techne-cli"
version = "0.1.0"
edition = "2024"
license.workspace = true
publish = false
description = "The techne command: the editor, the Lisp runtime and its servers as subcommands of one binary"

[[bin]]
name = "techne"
path = "src/main.rs"

[features]
default = ["window", "term"]
# The editor's frontends. A server builds without them: the window pulls in
# a GPU stack and windowing libraries.
window = ["dep:techne-window"]
term = ["dep:techne-term"]

[dependencies]
techne-vm = { path = "../techne-vm", features = ["counting-allocator"] }
# Their own binaries, which their tests run, are built with the counting
# allocator only: turning it on here builds them in a workspace build.
techne-node = { path = "../techne-node", features = ["counting-allocator"] }
techne-net = { path = "../techne-net" }
techne-process = { path = "../techne-process" }
techne-lsp = { path = "../techne-lsp", features = ["counting-allocator"] }
techne-host = { path = "../techne-host" }
tokio = { version = "1", features = ["rt", "time"] }
techne-window = { path = "../techne-window", optional = true }
techne-term = { path = "../techne-term", optional = true }

[dev-dependencies]
tempfile = "3"
