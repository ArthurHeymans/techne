[package]
name = "techne-http-bench"
version = "0.1.0"
edition = "2024"
publish = false
description = "techne-vm as an HTTP server: TCP natives over tokio, the server in Lisp"

# Not a member of the techne workspace: a benchmark harness only.
[workspace]

[dependencies]
techne-vm = { path = "../../../../crates/techne-vm" }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "net", "sync", "time", "macros"] }
socket2 = { version = "0.6", features = ["all"] }

[profile.release]
debug = 1
